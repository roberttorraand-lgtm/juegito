name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/modest-tesla-rdmz8g]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # give every script and the stylesheet a per-commit version so browsers
      # never mix old cached files with a new page
      - name: Cache-bust assets
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s/(src=\"[a-z]+\.js)\"/\1?v=$V\"/g; s/(href=\"style\.css)\"/\1?v=$V\"/" game/index.html
          grep -E "\.js\?v=|style\.css\?v=" game/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game
      - id: deployment
        uses: actions/deploy-pages@v4
