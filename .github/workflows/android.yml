name: Build Android APK

on:
  push:
    branches: [main, claude/modest-tesla-rdmz8g]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk La-Distorsion-Externa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: La-Distorsion-Externa-apk
          path: La-Distorsion-Externa.apk

      - name: Publish as a downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest La-Distorsion-Externa.apk \
            --title "APK - La Distorsion Externa" \
            --notes "Version Android generada automaticamente desde ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
