<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Distorsión Externa</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#0c0812">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <div id="hub" class="hidden">
    <div id="hub-side">
      <div class="hub-logo">
        <div class="hl-small">PROJECT MOON FAN GAME</div>
        <div class="hl-title">LA DISTORSIÓN EXTERNA</div>
      </div>
      <button class="hub-btn sel" data-hub="historia">Historia</button>
      <button class="hub-btn" data-hub="combate">Test de Combate</button>
      <button class="hub-btn" data-hub="personajes" disabled>Personajes</button>
      <button class="hub-btn" data-hub="ajustes">Ajustes</button>
      <div class="hub-sep"></div>
      <div class="hub-foot">Fan game no oficial · Project Moon</div>
    </div>
  </div>

  <div id="levels" class="hidden"></div>
  <div id="confirm" class="hidden"></div>
  <div id="settings" class="hidden"></div>
  <div id="combat-ui" class="hidden"></div>

  <div id="save-indicator">● Guardado</div>

  <div id="card" class="screen hidden">
    <div class="c-title"></div>
    <div class="c-sub"></div>
  </div>

  <div id="box" class="hidden">
    <div id="name"></div>
    <div id="text"></div>
    <div id="next">▼</div>
    <div id="box-btns">
      <button data-box="log" title="Historial (L)">LOG</button>
      <button data-box="auto" title="Avance automático (A)">AUTO</button>
      <button data-box="skip" title="Saltar (mantén Ctrl)">SKIP</button>
    </div>
  </div>

  <div id="backlog" class="hidden"><div id="backlog-head">HISTORIAL <span>L / Esc para cerrar</span></div><div id="backlog-list"></div></div>

  <div id="hint">Clic / Espacio: avanzar · Ctrl: saltar · A: auto · L: historial · H: ocultar texto · M: sonido</div>
</div>

<script src="save.js"></script>
<script src="renderer.js"></script>
<script src="engine.js"></script>
<script src="audio.js"></script>
<script src="backgrounds.js"></script>
<script src="effects.js"></script>
<script src="story.js"></script>
<script src="combat.js"></script>
<script src="moves.js"></script>
<script src="cinema.js"></script>
<script src="hub.js"></script>
<script src="market.js"></script>
<script src="mejoras.js"></script>
<script src="theme.js"></script>
<script src="main.js"></script>
<script>
  // installable and playable offline in the browser (not inside the apps)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.Capacitor) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
