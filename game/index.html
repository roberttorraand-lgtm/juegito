<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Distorsión Externa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <canvas id="cv" width="320" height="180"></canvas>

    <div id="hub" class="hidden">
      <div id="hub-side">
        <div class="hub-logo">
          <div class="hl-small">PROJECT MOON FAN GAME</div>
          <div class="hl-title">LA DISTORSIÓN EXTERNA</div>
        </div>
        <button class="hub-btn sel" data-hub="historia">Historia</button>
        <button class="hub-btn" data-hub="personajes" disabled>Personajes</button>
        <button class="hub-btn" data-hub="ajustes" disabled>Ajustes</button>
        <div class="hub-sep"></div>
        <div class="hub-foot">Fan game no oficial · Project Moon</div>
      </div>
    </div>

    <div id="chapters" class="hidden">
      <div class="ch-head">— HISTORIA —</div>
      <div class="ch-card sel" data-ch="1">
        <div class="ch-num">I</div>
        <div class="ch-info">
          <div class="ch-name">La Distorsión Externa</div>
          <div class="ch-desc">Discord, una habitación y una sucursal abandonada.</div>
          <div class="ch-status" id="ch1-status"></div>
        </div>
      </div>
      <div class="ch-card" data-ch="2" data-locked>
        <div class="ch-num">II</div>
        <div class="ch-info">
          <div class="ch-name">???</div>
          <div class="ch-desc">Próximamente</div>
          <div class="ch-status locked">🔒 Bloqueado</div>
        </div>
      </div>
      <button class="ch-back" data-hub="back">← Volver</button>
    </div>

    <div id="save-indicator">● Guardado</div>

    <div id="card" class="screen hidden">
      <div class="c-title"></div>
      <div class="c-sub"></div>
    </div>

    <div id="box" class="hidden">
      <div id="name"></div>
      <div id="text"></div>
      <div id="next">▼</div>
    </div>

    <div id="hint">Clic / Espacio: avanzar · Ctrl: saltar · H: ocultar texto · M: sonido</div>
  </div>
  <script src="engine.js"></script>
  <script src="story.js"></script>
  <script src="main.js"></script>
</body>
</html>
